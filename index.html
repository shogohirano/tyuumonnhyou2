<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>かたちレストラン</title>
  <style>
    /* --- 基本スタイル & リセット --- */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Sans", "Meiryo", "Yu Gothic", sans-serif;
      background-color: #FFFDF0;
      color: #333333;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- ヘッダー --- */
    header {
      background-color: #FF9800;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sound-toggle-btn {
      background: white;
      color: #333;
      border: 3px solid #E65100;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 #E65100;
      transition: all 0.1s;
    }

    .sound-toggle-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 #E65100;
    }

    /* --- メインコンテンツ領域 --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* 画面切り替え表示 */
    .screen {
      display: none;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- 画面タイトルのバッジ --- */
    .plate-badge {
      font-size: 2.2rem;
      font-weight: bold;
      padding: 12px 35px;
      border-radius: 50px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background-color: white;
    }

    /* 形別のテーマカラー */
    .theme-maru {
      border: 6px solid #FF5252;
      color: #D32F2F;
      background-color: #FFEBEE;
    }
    .theme-sankaku {
      border: 6px solid #0288D1;
      color: #0277BD;
      background-color: #E1F5FE;
    }
    .theme-shikaku {
      border: 6px solid #388E3C;
      color: #2E7D32;
      background-color: #E8F5E9;
    }

    /* --- 料理カードのグリッド --- */
    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      width: 100%;
      margin-bottom: 25px;
    }

    .food-card {
      background: white;
      border: 5px solid #E0E0E0;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      position: relative;
    }

    .food-card:active {
      transform: scale(0.97);
    }

    /* 選択状態のハイライト */
    .food-card.selected {
      border-color: #FF9800;
      border-width: 7px;
      background-color: #FFF8E1;
      box-shadow: 0 10px 20px rgba(255, 152, 0, 0.3);
      transform: translateY(-4px);
    }

    .food-card.selected::after {
      content: "✓";
      position: absolute;
      top: 10px;
      right: 15px;
      background: #FF9800;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    .food-image {
      width: 160px;
      height: 160px;
      margin-bottom: 12px;
    }

    .food-name {
      font-size: 1.8rem;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    /* --- 個数選択エリア --- */
    .quantity-section {
      background: white;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      text-align: center;
    }

    .quantity-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #555;
    }

    .quantity-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .qty-btn {
      background-color: #F5F5F5;
      border: 4px solid #BDBDBD;
      border-radius: 18px;
      font-size: 2rem;
      font-weight: bold;
      padding: 15px 35px;
      cursor: pointer;
      transition: all 0.15s;
      color: #424242;
      box-shadow: 0 4px 0 #9E9E9E;
    }

    .qty-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #9E9E9E;
    }

    .qty-btn.selected {
      background-color: #4CAF50;
      color: white;
      border-color: #2E7D32;
      box-shadow: 0 4px 0 #1B5E20;
    }

    .qty-btn.selected:active {
      box-shadow: 0 0 0 #1B5E20;
    }

    /* スパゲッティ用の特別メッセージ */
    .spaghetti-notice {
      font-size: 1.4rem;
      font-weight: bold;
      color: #E65100;
      background-color: #FFF3E0;
      padding: 12px 20px;
      border-radius: 12px;
      display: inline-block;
    }

    /* --- ナビゲーションボタン (まえへ・つぎへ) --- */
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 10px;
      gap: 20px;
    }

    .btn {
      font-size: 1.8rem;
      font-weight: bold;
      padding: 18px 40px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 0 rgba(0,0,0,0.2);
      transition: all 0.15s;
      min-width: 200px;
    }

    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 rgba(0,0,0,0.2) !important;
    }

    .btn-prev {
      background-color: #78909C;
      color: white;
      box-shadow: 0 6px 0 #455A64;
    }

    .btn-next {
      background-color: #FF9800;
      color: white;
      box-shadow: 0 6px 0 #E65100;
      margin-left: auto;
    }

    .btn-confirm {
      background-color: #E91E63;
      color: white;
      box-shadow: 0 6px 0 #AD1457;
      margin-left: auto;
    }

    .btn-start {
      background-color: #FF5722;
      color: white;
      font-size: 2.5rem;
      padding: 22px 60px;
      box-shadow: 0 8px 0 #BF360C;
    }

    /* --- スタート画面 --- */
    .start-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 20px 0;
    }

    .start-title {
      font-size: 3.5rem;
      color: #E65100;
      text-shadow: 3px 3px 0px #FFE0B2;
      letter-spacing: 4px;
    }

    .shape-banner {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
    }

    /* --- 注文確認画面 --- */
    .summary-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    .summary-card {
      background: white;
      border-radius: 20px;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      border-left: 12px solid #CCC;
    }

    .summary-card.maru { border-left-color: #FF5252; }
    .summary-card.sankaku { border-left-color: #0288D1; }
    .summary-card.shikaku { border-left-color: #388E3C; }

    .summary-plate-info {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.6rem;
      font-weight: bold;
      min-width: 220px;
    }

    .summary-food-info {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      flex: 1;
    }

    /* SVGコンテナとSVG本体の幅・高さ・配置を正しく揃える調整 */
    .summary-food-icon {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .summary-food-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .summary-food-name {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .summary-food-qty {
      font-size: 2rem;
      font-weight: bold;
      color: #E65100;
      background: #FFF3E0;
      padding: 6px 20px;
      border-radius: 30px;
      min-width: 100px;
      text-align: center;
    }

    .summary-empty {
      font-size: 1.5rem;
      color: #888;
      font-weight: bold;
    }

    .summary-actions {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-fix {
      background-color: #00ACC1;
      color: white;
      box-shadow: 0 6px 0 #006064;
      font-size: 1.4rem;
      padding: 15px 25px;
    }

    .btn-reset {
      background-color: #8E24AA;
      color: white;
      box-shadow: 0 6px 0 #4A148C;
      font-size: 1.4rem;
      padding: 15px 25px;
    }

    .btn-complete {
      background-color: #4CAF50;
      color: white;
      box-shadow: 0 6px 0 #1B5E20;
      font-size: 1.8rem;
      padding: 18px 40px;
    }

    /* 注文完了画面 */
    .complete-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      padding: 20px 0;
      width: 100%;
    }

    .complete-message {
      font-size: 3rem;
      color: #2E7D32;
      font-weight: bold;
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .tray-display {
      background: #FFF8E1;
      border: 8px solid #FFB300;
      border-radius: 30px;
      padding: 25px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    .tray-item {
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      min-width: 200px;
      text-align: center;
    }

    .tray-food-icon {
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }

    .tray-food-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* レスポンシブ調整 */
    @media (max-width: 768px) {
      .start-title { font-size: 2.5rem; }
      .plate-badge { font-size: 1.7rem; padding: 10px 20px; }
      .food-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
      .food-image { width: 120px; height: 120px; }
      .food-name { font-size: 1.5rem; }
      .btn { font-size: 1.4rem; padding: 14px 25px; min-width: 140px; }
      .qty-btn { font-size: 1.6rem; padding: 12px 24px; }
      .summary-card { flex-direction: column; gap: 15px; align-items: flex-start; }
      .summary-food-info { width: 100%; justify-content: space-between; }
      .complete-message { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-title">
      <span>🍴 かたちレストラン</span>
    </div>
    <button class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleSound()">
      🔊 おと：ON
    </button>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <!-- 1. はじめの画面 -->
    <div id="screen-start" class="screen active">
      <div class="start-container">
        <h1 class="start-title">かたちレストラン</h1>
        
        <div class="shape-banner">
          <!-- ○ SVG -->
          <svg width="80" height="80" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" fill="#FFEBEE" stroke="#FF5252" stroke-width="12"/>
          </svg>
          <!-- △ SVG -->
          <svg width="80" height="80" viewBox="0 0 100 100">
            <polygon points="50,10 90,85 10,85" fill="#E1F5FE" stroke="#0288D1" stroke-width="10" stroke-linejoin="round"/>
          </svg>
          <!-- □ SVG -->
          <svg width="80" height="80" viewBox="0 0 100 100">
            <rect x="12" y="12" width="76" height="76" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="12"/>
          </svg>
        </div>

        <p style="font-size: 1.6rem; font-weight: bold; color: #666;">おさらに のせる りょうりを えらんでね！</p>

        <button class="btn btn-start" onclick="goToScreen('screen-maru')">
          ちゅうもんスタート ➔
        </button>
      </div>
    </div>

    <!-- 2. ○のおさら メニュー選択画面 -->
    <div id="screen-maru" class="screen">
      <div class="plate-badge theme-maru">
        <svg width="45" height="45" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="#FF5252"/>
        </svg>
        <span>○ の おさら</span>
      </div>

      <div class="food-grid">
        <!-- おにぎり -->
        <div class="food-card" id="card-onigiri" onclick="selectFood('maru', 'onigiri')">
          <svg class="food-image" viewBox="0 0 200 200">
            <!-- 海苔と本体 -->
            <polygon points="100,25 175,155 25,155" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="8" stroke-linejoin="round"/>
            <path d="M 65 155 L 135 155 L 125 110 L 75 110 Z" fill="#333333"/>
            <!-- 梅干し -->
            <circle cx="100" cy="80" r="14" fill="#E53935"/>
          </svg>
          <div class="food-name">おにぎり</div>
        </div>

        <!-- パン -->
        <div class="food-card" id="card-pan" onclick="selectFood('maru', 'pan')">
          <svg class="food-image" viewBox="0 0 200 200">
            <!-- 食パン -->
            <path d="M 40 70 C 40 40, 70 30, 100 30 C 130 30, 160 40, 160 70 L 160 160 C 160 170, 150 175, 140 175 L 60 175 C 50 175, 40 170, 40 160 Z" fill="#FFE082" stroke="#8D6E63" stroke-width="10" stroke-linejoin="round"/>
            <path d="M 55 75 C 55 55, 75 45, 100 45 C 125 45, 145 55, 145 75 L 145 160 L 55 160 Z" fill="#FFF8E1"/>
          </svg>
          <div class="food-name">パン</div>
        </div>

        <!-- スパゲッティ -->
        <div class="food-card" id="card-spaghetti" onclick="selectFood('maru', 'spaghetti')">
          <svg class="food-image" viewBox="0 0 200 200">
            <!-- 皿 -->
            <ellipse cx="100" cy="150" rx="85" ry="30" fill="#E0E0E0"/>
            <!-- 麺 -->
            <path d="M 40 130 Q 70 80 100 120 T 160 110 Q 130 150 100 130 T 40 130" fill="#FFCA28" stroke="#FFA000" stroke-width="8"/>
            <!-- ミートソース -->
            <ellipse cx="100" cy="115" rx="45" ry="25" fill="#D84315"/>
            <!-- パセリ -->
            <circle cx="95" cy="110" r="5" fill="#4CAF50"/>
            <circle cx="105" cy="115" r="4" fill="#4CAF50"/>
          </svg>
          <div class="food-name">スパゲッティ</div>
        </div>
      </div>

      <!-- 個数選択エリア -->
      <div class="quantity-section" id="qty-section-maru" style="display: none;">
        <div class="quantity-title" id="qty-title-maru">いくつ に する？</div>
        <div class="quantity-buttons" id="qty-btns-maru">
          <button class="qty-btn" id="qty-maru-1" onclick="selectQuantity('maru', 1)">１こ</button>
          <button class="qty-btn" id="qty-maru-2" onclick="selectQuantity('maru', 2)">２こ</button>
          <button class="qty-btn" id="qty-maru-3" onclick="selectQuantity('maru', 3)">３こ</button>
        </div>
        <div class="spaghetti-notice" id="spaghetti-notice-maru" style="display: none;">
          スパゲッティ は １つの ちゅうもん に なるよ！
        </div>
      </div>

      <!-- ナビゲーション -->
      <div class="nav-buttons">
        <button class="btn btn-next" id="next-btn-maru" onclick="goToScreen('screen-sankaku')" style="visibility: hidden;">
          つぎへ ➔
        </button>
      </div>
    </div>

    <!-- 3. △のおさら メニュー選択画面 -->
    <div id="screen-sankaku" class="screen">
      <div class="plate-badge theme-sankaku">
        <svg width="45" height="45" viewBox="0 0 100 100">
          <polygon points="50,10 90,85 10,85" fill="#0288D1"/>
        </svg>
        <span>△ の おさら</span>
      </div>

      <div class="food-grid">
        <!-- オムレツ -->
        <div class="food-card" id="card-omelette" onclick="selectFood('sankaku', 'omelette')">
          <svg class="food-image" viewBox="0 0 200 200">
            <path d="M 30 120 C 30 50, 170 50, 170 120 C 170 150, 30 150, 30 120 Z" fill="#FFCA28" stroke="#FFA000" stroke-width="6"/>
            <!-- ケチャップ -->
            <path d="M 50 110 Q 70 90 90 110 T 130 110 T 150 100" fill="none" stroke="#D32F2F" stroke-width="10" stroke-linecap="round"/>
          </svg>
          <div class="food-name">オムレツ</div>
        </div>

        <!-- ハンバーグ -->
        <div class="food-card" id="card-hamburg" onclick="selectFood('sankaku', 'hamburg')">
          <svg class="food-image" viewBox="0 0 200 200">
            <ellipse cx="100" cy="110" rx="70" ry="45" fill="#5D4037" stroke="#3E2723" stroke-width="6"/>
            <!-- ソース・肉汁 -->
            <ellipse cx="90" cy="100" rx="45" ry="25" fill="#4E342E"/>
            <path d="M 110 85 Q 120 75 130 85" stroke="#FFB74D" stroke-width="5" fill="none" stroke-linecap="round"/>
          </svg>
          <div class="food-name">ハンバーグ</div>
        </div>

        <!-- エビフライ -->
        <div class="food-card" id="card-ebifurai" onclick="selectFood('sankaku', 'ebifurai')">
          <svg class="food-image" viewBox="0 0 200 200">
            <!-- 衣 -->
            <path d="M 40 140 C 60 70, 140 60, 160 90 C 150 130, 80 150, 40 140 Z" fill="#FFB300" stroke="#E65100" stroke-width="6"/>
            <!-- 尻尾 -->
            <polygon points="160,90 185,75 180,95 190,110 165,100" fill="#E53935"/>
          </svg>
          <div class="food-name">エビフライ</div>
        </div>
      </div>

      <!-- 個数選択エリア -->
      <div class="quantity-section" id="qty-section-sankaku" style="display: none;">
        <div class="quantity-title">いくつ に する？</div>
        <div class="quantity-buttons">
          <button class="qty-btn" id="qty-sankaku-1" onclick="selectQuantity('sankaku', 1)">１こ</button>
          <button class="qty-btn" id="qty-sankaku-2" onclick="selectQuantity('sankaku', 2)">２こ</button>
          <button class="qty-btn" id="qty-sankaku-3" onclick="selectQuantity('sankaku', 3)">３こ</button>
        </div>
      </div>

      <!-- ナビゲーション -->
      <div class="nav-buttons">
        <button class="btn btn-prev" onclick="goToScreen('screen-maru')">
          ⬅ まえへ
        </button>
        <button class="btn btn-next" id="next-btn-sankaku" onclick="goToScreen('screen-shikaku')" style="visibility: hidden;">
          つぎへ ➔
        </button>
      </div>
    </div>

    <!-- 4. □のおさら メニュー選択画面 -->
    <div id="screen-shikaku" class="screen">
      <div class="plate-badge theme-shikaku">
        <svg width="45" height="45" viewBox="0 0 100 100">
          <rect x="10" y="10" width="80" height="80" rx="8" fill="#388E3C"/>
        </svg>
        <span>□ の おさら</span>
      </div>

      <div class="food-grid">
        <!-- シューマイ -->
        <div class="food-card" id="card-shumai" onclick="selectFood('shikaku', 'shumai')">
          <svg class="food-image" viewBox="0 0 200 200">
            <path d="M 50 80 Q 50 60 100 60 Q 150 60 150 80 L 140 150 Q 100 160 60 150 Z" fill="#FFF9C4" stroke="#FBC02D" stroke-width="6"/>
            <!-- グリーンピース -->
            <circle cx="100" cy="70" r="12" fill="#4CAF50"/>
          </svg>
          <div class="food-name">シューマイ</div>
        </div>

        <!-- たまごやき -->
        <div class="food-card" id="card-tamagoyaki" onclick="selectFood('shikaku', 'tamagoyaki')">
          <svg class="food-image" viewBox="0 0 200 200">
            <rect x="40" y="70" width="120" height="70" rx="15" fill="#FFEE58" stroke="#F57F17" stroke-width="6"/>
            <path d="M 70 70 C 70 90, 70 120, 70 140" stroke="#FBC02D" stroke-width="4" fill="none"/>
            <path d="M 100 70 C 100 90, 100 120, 100 140" stroke="#FBC02D" stroke-width="4" fill="none"/>
            <path d="M 130 70 C 130 90, 130 120, 130 140" stroke="#FBC02D" stroke-width="4" fill="none"/>
          </svg>
          <div class="food-name">たまごやき</div>
        </div>

        <!-- ウインナー -->
        <div class="food-card" id="card-wiener" onclick="selectFood('shikaku', 'wiener')">
          <svg class="food-image" viewBox="0 0 200 200">
            <rect x="40" y="80" width="120" height="45" rx="22" fill="#E57373" stroke="#C62828" stroke-width="6" transform="rotate(-15 100 100)"/>
            <!-- 切れ込み -->
            <line x1="70" y1="80" x2="80" y2="95" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
            <line x1="95" y1="75" x2="105" y2="90" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
            <line x1="120" y1="70" x2="130" y2="85" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
          </svg>
          <div class="food-name">ウインナー</div>
        </div>

        <!-- やさい -->
        <div class="food-card" id="card-yasai" onclick="selectFood('shikaku', 'yasai')">
          <svg class="food-image" viewBox="0 0 200 200">
            <!-- ブロッコリー -->
            <circle cx="80" cy="90" r="30" fill="#66BB6A"/>
            <circle cx="110" cy="80" r="35" fill="#4CAF50"/>
            <circle cx="130" cy="100" r="28" fill="#388E3C"/>
            <path d="M 95 115 L 90 155 L 115 155 L 110 115 Z" fill="#81C784"/>
            <!-- トマト -->
            <circle cx="70" cy="135" r="22" fill="#E53935"/>
            <path d="M 70 113 L 65 118 L 75 118 Z" fill="#2E7D32"/>
          </svg>
          <div class="food-name">やさい</div>
        </div>
      </div>

      <!-- 個数選択エリア -->
      <div class="quantity-section" id="qty-section-shikaku" style="display: none;">
        <div class="quantity-title">いくつ に する？</div>
        <div class="quantity-buttons">
          <button class="qty-btn" id="qty-shikaku-1" onclick="selectQuantity('shikaku', 1)">１こ</button>
          <button class="qty-btn" id="qty-shikaku-2" onclick="selectQuantity('shikaku', 2)">２こ</button>
          <button class="qty-btn" id="qty-shikaku-3" onclick="selectQuantity('shikaku', 3)">３こ</button>
        </div>
      </div>

      <!-- ナビゲーション -->
      <div class="nav-buttons">
        <button class="btn btn-prev" onclick="goToScreen('screen-sankaku')">
          ⬅ まえへ
        </button>
        <button class="btn btn-confirm" id="next-btn-shikaku" onclick="goToScreen('screen-confirm')" style="visibility: hidden;">
          ちゅうもんを かくにん ➔
        </button>
      </div>
    </div>

    <!-- 5. さいごのちゅうもんかくにん画面 -->
    <div id="screen-confirm" class="screen">
      <div class="plate-badge" style="border: 5px solid #FF9800; color: #E65100;">
        <span>📋 ちゅうもんを かくにんしよう</span>
      </div>

      <div class="summary-list">
        <!-- ○のおさら 結果 -->
        <div class="summary-card maru">
          <div class="summary-plate-info">
            <svg width="35" height="35" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="40" fill="#FF5252"/>
            </svg>
            <span>【○ の おさら】</span>
          </div>
          <div class="summary-food-info" id="summary-maru">
            <!-- JSで動的生成 -->
          </div>
          <button class="btn btn-fix" onclick="goToScreen('screen-maru')">なおす</button>
        </div>

        <!-- △のおさら 結果 -->
        <div class="summary-card sankaku">
          <div class="summary-plate-info">
            <svg width="35" height="35" viewBox="0 0 100 100">
              <polygon points="50,10 90,85 10,85" fill="#0288D1"/>
            </svg>
            <span>【△ の おさら】</span>
          </div>
          <div class="summary-food-info" id="summary-sankaku">
            <!-- JSで動的生成 -->
          </div>
          <button class="btn btn-fix" onclick="goToScreen('screen-sankaku')">なおす</button>
        </div>

        <!-- □のおさら 結果 -->
        <div class="summary-card shikaku">
          <div class="summary-plate-info">
            <svg width="35" height="35" viewBox="0 0 100 100">
              <rect x="10" y="10" width="80" height="80" rx="8" fill="#388E3C"/>
            </svg>
            <span>【□ の おさら】</span>
          </div>
          <div class="summary-food-info" id="summary-shikaku">
            <!-- JSで動的生成 -->
          </div>
          <button class="btn btn-fix" onclick="goToScreen('screen-shikaku')">なおす</button>
        </div>
      </div>

      <!-- 確認画面アクションボタン -->
      <div class="summary-actions">
        <button class="btn btn-reset" onclick="resetOrder()">
          🔄 さいしょから
        </button>
        <button class="btn btn-complete" onclick="completeOrder()">
          ✨ ちゅうもんできた！
        </button>
      </div>
    </div>

    <!-- 6. 注文完了画面 -->
    <div id="screen-complete" class="screen">
      <div class="complete-container">
        <div class="complete-message">🎉 ちゅうもん できたね！</div>
        
        <p style="font-size: 1.6rem; font-weight: bold; color: #555;">きみが えらんだ おいしい りょうりだよ！</p>

        <div class="tray-display" id="tray-display">
          <!-- JSで注文した料理カードを一覧表示 -->
        </div>

        <button class="btn btn-start" onclick="resetOrder()" style="margin-top: 20px;">
          🔄 もういちど ちゅうもんする
        </button>
      </div>
    </div>

  </main>

  <script>
    /* --- 料理のマスターデータ --- */
    const FOOD_DATA = {
      onigiri: { name: 'おにぎり', hasQty: true, svgId: 'card-onigiri' },
      pan: { name: 'パン', hasQty: true, svgId: 'card-pan' },
      spaghetti: { name: 'スパゲッティ', hasQty: false, svgId: 'card-spaghetti' },
      omelette: { name: 'オムレツ', hasQty: true, svgId: 'card-omelette' },
      hamburg: { name: 'ハンバーグ', hasQty: true, svgId: 'card-hamburg' },
      ebifurai: { name: 'エビフライ', hasQty: true, svgId: 'card-ebifurai' },
      shumai: { name: 'シューマイ', hasQty: true, svgId: 'card-shumai' },
      tamagoyaki: { name: 'たまごやき', hasQty: true, svgId: 'card-tamagoyaki' },
      wiener: { name: 'ウインナー', hasQty: true, svgId: 'card-wiener' },
      yasai: { name: 'やさい', hasQty: true, svgId: 'card-yasai' }
    };

    /* --- 注文データの一元管理 --- */
    let currentOrders = {
      maru: { foodKey: null, qty: null },
      sankaku: { foodKey: null, qty: null },
      shikaku: { foodKey: null, qty: null }
    };

    /* --- 効果音設定 (Web Audio API) --- */
    let isSoundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'tap') {
        // タップ音（ぴっ）
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'select') {
        // 選択音（ぽん）
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'fanfare') {
        // 完成ファンファーレ（じゃーん）
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const oscN = audioCtx.createOscillator();
          const gainN = audioCtx.createGain();
          oscN.connect(gainN);
          gainN.connect(audioCtx.destination);

          oscN.type = 'triangle';
          oscN.frequency.setValueAtTime(freq, now + index * 0.1);
          gainN.gain.setValueAtTime(0.3, now + index * 0.1);
          gainN.gain.exponentialRampToValueAtTime(0.01, now + index * 0.1 + 0.4);

          oscN.start(now + index * 0.1);
          oscN.stop(now + index * 0.1 + 0.4);
        });
      }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      const btn = document.getElementById('soundToggleBtn');
      if (isSoundEnabled) {
        btn.textContent = '🔊 おと：ON';
        playSound('tap');
      } else {
        btn.textContent = '🔇 おと：OFF';
      }
    }

    /* --- 画面遷移 --- */
    function goToScreen(screenId) {
      playSound('tap');

      // 全画面非表示
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

      // 該当画面表示
      const target = document.getElementById(screenId);
      if (target) {
        target.classList.add('active');
      }

      // 確認画面の場合は表示を更新
      if (screenId === 'screen-confirm') {
        renderSummary();
      }

      window.scrollTo(0, 0);
    }

    /* --- 料理選択処理 --- */
    function selectFood(plateShape, foodKey) {
      playSound('select');
      const order = currentOrders[plateShape];
      order.foodKey = foodKey;

      const foodInfo = FOOD_DATA[foodKey];

      // スパゲッティは個数選択なし（自動で1扱い）
      if (!foodInfo.hasQty) {
        order.qty = 1;
      } else if (order.qty === null) {
        // 初期選択時はデフォルトなし、個数ボタンを押させる
      }

      updatePlateUI(plateShape);
    }

    /* --- 個数選択処理 --- */
    function selectQuantity(plateShape, qty) {
      playSound('select');
      const order = currentOrders[plateShape];
      if (!order.foodKey) return;

      order.qty = qty;
      updatePlateUI(plateShape);
    }

    /* --- 画面表示UIの更新 --- */
    function updatePlateUI(plateShape) {
      const order = currentOrders[plateShape];
      const screenElem = document.getElementById(`screen-${plateShape}`);

      // 料理カードの選択状態を更新
      const cards = screenElem.querySelectorAll('.food-card');
      cards.forEach(card => card.classList.remove('selected'));

      if (order.foodKey) {
        const selectedCard = document.getElementById(FOOD_DATA[order.foodKey].svgId);
        if (selectedCard) selectedCard.classList.add('selected');
      }

      // 個数選択エリアの表示制御
      const qtySection = document.getElementById(`qty-section-${plateShape}`);
      const nextBtn = document.getElementById(`next-btn-${plateShape}`);

      if (order.foodKey) {
        qtySection.style.display = 'block';
        const foodInfo = FOOD_DATA[order.foodKey];

        if (plateShape === 'maru') {
          const qtyBtns = document.getElementById('qty-btns-maru');
          const notice = document.getElementById('spaghetti-notice-maru');
          const qtyTitle = document.getElementById('qty-title-maru');

          if (!foodInfo.hasQty) {
            qtyBtns.style.display = 'none';
            notice.style.display = 'inline-block';
            qtyTitle.style.display = 'none';
          } else {
            qtyBtns.style.display = 'flex';
            notice.style.display = 'none';
            qtyTitle.style.display = 'block';
          }
        }

        // 個数ボタンのハイライト更新
        const qtyButtons = qtySection.querySelectorAll('.qty-btn');
        qtyButtons.forEach((btn, idx) => {
          if (order.qty === idx + 1) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });

        // 「つぎへ」ボタンの表示可否（料理と個数が決定したら表示）
        if (order.qty !== null || !foodInfo.hasQty) {
          nextBtn.style.visibility = 'visible';
        } else {
          nextBtn.style.visibility = 'hidden';
        }
      } else {
        qtySection.style.display = 'none';
        nextBtn.style.visibility = 'hidden';
      }
    }

    /* --- 注文確認画面のレンダリング --- */
    function renderSummary() {
      const shapes = ['maru', 'sankaku', 'shikaku'];

      shapes.forEach(shape => {
        const container = document.getElementById(`summary-${shape}`);
        const order = currentOrders[shape];

        if (order.foodKey) {
          const food = FOOD_DATA[order.foodKey];
          const svgSource = document.getElementById(food.svgId).querySelector('.food-image').outerHTML;
          
          let qtyText = '';
          if (food.hasQty) {
            qtyText = `${order.qty}こ`;
          } else {
            qtyText = ''; // スパゲッティは個数表示なし
          }

          container.innerHTML = `
            <div class="summary-food-icon">${svgSource}</div>
            <div class="summary-food-name">${food.name}</div>
            ${qtyText ? `<div class="summary-food-qty">${qtyText}</div>` : ''}
          `;
        } else {
          container.innerHTML = `
            <div class="summary-empty">まだ えらんでいません</div>
          `;
        }
      });
    }

    /* --- 注文完了処理 --- */
    function completeOrder() {
      playSound('fanfare');
      goToScreen('screen-complete');

      const tray = document.getElementById('tray-display');
      tray.innerHTML = '';

      const shapes = [
        { key: 'maru', name: '○のおさら' },
        { key: 'sankaku', name: '△のおさら' },
        { key: 'shikaku', name: '□のおさら' }
      ];

      shapes.forEach(s => {
        const order = currentOrders[s.key];
        if (order.foodKey) {
          const food = FOOD_DATA[order.foodKey];
          const svgSource = document.getElementById(food.svgId).querySelector('.food-image').outerHTML;
          const qtyText = food.hasQty ? `${order.qty}こ` : '';

          const itemHtml = `
            <div class="tray-item">
              <div style="font-size: 1.2rem; color: #888; font-weight: bold;">${s.name}</div>
              <div class="tray-food-icon">${svgSource}</div>
              <div style="font-size: 1.6rem; font-weight: bold;">${food.name}</div>
              ${qtyText ? `<div style="font-size: 1.5rem; font-weight: bold; color: #E65100; margin-top: 4px;">${qtyText}</div>` : ''}
            </div>
          `;
          tray.innerHTML += itemHtml;
        }
      });

      if (tray.innerHTML === '') {
        tray.innerHTML = '<div style="font-size: 1.5rem; color: #888;">何も えらばれて いません</div>';
      }
    }

    /* --- 最初からリセット --- */
    function resetOrder() {
      playSound('tap');
      currentOrders = {
        maru: { foodKey: null, qty: null },
        sankaku: { foodKey: null, qty: null },
        shikaku: { foodKey: null, qty: null }
      };

      ['maru', 'sankaku', 'shikaku'].forEach(shape => updatePlateUI(shape));
      goToScreen('screen-start');
    }

    // 初期化
    window.onload = function() {
      ['maru', 'sankaku', 'shikaku'].forEach(shape => updatePlateUI(shape));
    };
  </script>
</body>
</html>
